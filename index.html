<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindset Coffee - POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style type="text/tailwindcss">
  .inp{ @apply w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600; }
  .btn{ @apply px-4 py-2.5 rounded-xl text-xs font-semibold transition; }
  .btn-p{ @apply btn bg-emerald-600 hover:bg-emerald-700 text-white; }
  .btn-g{ @apply btn bg-slate-100 hover:bg-slate-200 text-slate-700; }
  .btn-r{ @apply btn bg-red-50 hover:bg-red-100 text-red-600; }
  .card{ @apply bg-white border border-slate-200 rounded-2xl shadow-sm; }
</style>
</head>
<body class="h-screen overflow-hidden bg-slate-100 text-slate-800" style="font-family:system-ui,sans-serif">

<div id="login" class="fixed inset-0 z-40 bg-[#0f172a] flex items-center justify-center">
  <form onsubmit="doLogin(event)" class="bg-white p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-4">
    <div class="text-center mb-4">
      <div class="flex items-center justify-center gap-2"><i class="fa-solid fa-mug-hot text-3xl text-emerald-600"></i><h1 class="text-3xl font-bold tracking-wider">Mindset</h1></div>
      <p class="text-xs text-slate-500 font-semibold tracking-wider mt-1">GOOD COFFEE • BETTER MINDSET</p>
    </div>
    <input class="inp" name="username" placeholder="Tên đăng nhập" required autocomplete="username">
    <input class="inp" name="password" type="password" placeholder="Mật khẩu" required autocomplete="current-password">
    <button class="btn-p w-full !py-3 text-sm">Đăng nhập</button>
  </form>
</div>

<div id="app" class="h-full flex flex-col hidden">
  <header class="bg-white border-b h-16 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2 text-emerald-600 font-bold text-xl"><i class="fa-solid fa-mug-hot"></i> Mindset</div>
    <div class="flex items-center gap-5 text-xs">
      <span id="who" class="bg-slate-100 border px-3 py-1.5 rounded-xl font-medium"></span>
      <span id="clock" class="text-slate-500"></span>
      <button onclick="logout()" class="btn-r"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
    </div>
  </header>
  <div class="flex-1 flex overflow-hidden">
    <aside class="w-60 bg-white border-r p-4 shrink-0"><nav id="nav" class="space-y-1.5"></nav></aside>
    <main id="main" class="flex-1 flex overflow-hidden"></main>
  </div>
</div>
<div id="modal"></div>

<script>
const S = { token: sessionStorage.token || null, user: JSON.parse(sessionStorage.user || 'null'), menu: { products: [], toppings: [], qr: null }, cart: [], cat: 'Tất cả', q: '', users: [] };
const $ = id => document.getElementById(id);
const vnd = n => Number(n).toLocaleString('vi-VN') + 'đ';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const img = s => s ? `<img src="${esc(s)}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-300 text-3xl"><i class="fa-solid fa-mug-saucer"></i></div>`;
const roleName = r => ({ admin: 'Admin', manager: 'Quản lý', staff: 'Nhân viên' }[r]);
const isMgr = () => S.user && S.user.role !== 'staff';
const modal = h => $('modal').innerHTML = `<div class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto">${h}</div></div>`;
const closeModal = () => $('modal').innerHTML = '';
const act = f => async (...a) => { try { await f(...a); } catch (e) { alert(e.message); } };
const form = e => { e.preventDefault(); return new FormData(e.target); };

async function api(url, opt = {}) {
  const headers = {}; let body = opt.body;
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  const r = await fetch(url, { method: opt.method || 'GET', headers, body });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && S.token) { clearSession(); } throw new Error(d.error || 'Có lỗi xảy ra'); }
  return d;
}
function clearSession() { sessionStorage.clear(); S.token = S.user = null; S.cart = []; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

setInterval(() => $('clock').innerText = new Date().toLocaleString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }), 1000);

const doLogin = act(async e => {
  const f = Object.fromEntries(form(e));
  const d = await api('/api/login', { method: 'POST', body: f });
  S.token = sessionStorage.token = d.token; S.user = d.user; sessionStorage.user = JSON.stringify(d.user);
  e.target.reset(); await start();
});
const logout = act(async () => { try { await api('/api/logout', { method: 'POST' }); } finally { clearSession(); } });

async function start() {
  S.menu = await api('/api/menu');
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').innerText = `${roleName(S.user.role)}: ${S.user.name}`;
  const tabs = isMgr() ? [['staff', 'fa-users-gear', 'Nhân viên & ca làm'], ['menu', 'fa-mug-saucer', 'Menu & Topping'], ['qr', 'fa-qrcode', 'QR chuyển khoản'], ['rev', 'fa-chart-line', 'Doanh thu']] : [['pos', 'fa-cash-register', 'Gọi món']];
  $('nav').innerHTML = tabs.map(t => `<button id="nav-${t[0]}" onclick="tab('${t[0]}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium"><i class="fa-solid ${t[1]} w-5"></i>${t[2]}</button>`).join('');
  tab(tabs[0][0]);
}
const tab = act(async t => {
  document.querySelectorAll('#nav button').forEach(b => b.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100');
  $('nav-' + t).className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium bg-emerald-600 text-white';
  ({ pos: renderPOS, staff: renderStaff, menu: () => renderMenuAdmin('Nước'), qr: renderQR, rev: renderRev })[t]();
});

/* ================= NHÂN VIÊN: POS ================= */
function renderPOS() {
  const cats = ['Tất cả', ...new Set(S.menu.products.map(p => p.type))];
  $('main').innerHTML = `
  <div class="flex-1 flex flex-col p-6 overflow-hidden">
    <div class="flex justify-between mb-5 gap-4">
      <div class="flex gap-2">${cats.map(c => `<button onclick="S.cat='${c}';renderPOS()" class="btn ${S.cat === c ? 'bg-emerald-600 text-white' : 'bg-white border text-slate-600'}">${c}</button>`).join('')}</div>
      <input id="q" value="${esc(S.q)}" oninput="S.q=this.value;drawGrid()" placeholder="Tìm món..." class="inp !w-64 !py-2 text-xs">
    </div>
    <div id="grid" class="flex-1 overflow-y-auto grid grid-cols-4 gap-4 items-start pr-2"></div>
  </div>
  <div class="w-96 bg-white border-l p-6 flex flex-col shrink-0">
    <h2 class="font-bold pb-4 border-b mb-4">Đơn hàng</h2>
    <div id="cart" class="flex-1 overflow-y-auto space-y-3"></div>
    <div class="pt-4 border-t mt-4 space-y-3">
      <div class="flex justify-between font-bold"><span>Tổng tiền</span><span id="total" class="text-emerald-600 text-lg">0đ</span></div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="pay('cash')" class="btn-g py-3"><i class="fa-solid fa-money-bill-wave text-emerald-600"></i> Tiền mặt</button>
        <button onclick="pay('transfer')" class="btn-p py-3"><i class="fa-solid fa-qrcode"></i> Chuyển khoản</button>
      </div>
    </div>
  </div>`;
  drawGrid(); drawCart();
}
function drawGrid() {
  const list = S.menu.products.filter(p => (S.cat === 'Tất cả' || p.type === S.cat) && p.name.toLowerCase().includes(S.q.toLowerCase()));
  $('grid').innerHTML = list.map(p => `<div onclick="itemModal(${p.id})" class="card p-3 cursor-pointer hover:border-emerald-600 h-52 flex flex-col">
    <div class="h-28 rounded-xl overflow-hidden mb-2 bg-slate-100 shrink-0">${img(p.image)}</div>
    <h3 class="font-semibold text-xs line-clamp-1">${esc(p.name)}</h3><p class="text-emerald-600 font-bold text-xs mt-auto">${vnd(p.price)}</p></div>`).join('') || '<p class="text-xs text-slate-400">Không có món.</p>';
}
const radios = (name, vals) => `<div class="flex gap-2">${vals.map((v, i) => `<label class="flex-1 cursor-pointer"><input type="radio" name="${name}" value="${v}" class="peer hidden" ${i === vals.length - 1 ? 'checked' : ''}><span class="block text-center py-2 rounded-xl text-xs border bg-slate-50 peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:font-bold">${v}</span></label>`).join('')}</div>`;
function itemModal(id) {
  const p = S.menu.products.find(x => x.id === id);
  modal(`<div class="flex justify-between mb-4"><h3 class="font-bold">${esc(p.name)}</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark text-slate-400"></i></button></div>
  <form onsubmit="addCart(event,${id})" class="space-y-4">
    ${p.type === 'Nước' ? `<div><p class="text-xs font-semibold mb-2">Mức đường</p>${radios('sugar', ['30%', '50%', '70%', '100%'])}</div><div><p class="text-xs font-semibold mb-2">Mức đá</p>${radios('ice', ['0%', '30%', '50%', '70%', '100%'])}</div>` : ''}
    ${S.menu.toppings.length ? `<div><p class="text-xs font-semibold mb-2">Topping</p><div class="space-y-2 max-h-40 overflow-y-auto">${S.menu.toppings.map(t => `<label class="flex justify-between p-2.5 rounded-xl bg-slate-50 border cursor-pointer text-xs"><span><input type="checkbox" name="top" value="${t.id}" class="accent-emerald-600 mr-2">${esc(t.name)}</span><b class="text-emerald-600">+${vnd(t.price)}</b></label>`).join('')}</div></div>` : ''}
    <div class="flex gap-3"><button type="button" onclick="closeModal()" class="btn-g flex-1">Hủy</button><button class="btn-p flex-1">Thêm vào đơn</button></div>
  </form>`);
}
function addCart(e, id) {
  const f = form(e), p = S.menu.products.find(x => x.id === id);
  const toppingIds = f.getAll('top').map(Number), tops = S.menu.toppings.filter(t => toppingIds.includes(t.id));
  const sugar = f.get('sugar'), ice = f.get('ice');
  const key = [id, sugar, ice, toppingIds.join('.')].join('|');
  const ex = S.cart.find(i => i.key === key);
  if (ex) ex.qty++; else S.cart.push({ key, productId: id, sugar, ice, toppingIds, qty: 1, price: p.price + tops.reduce((s, t) => s + t.price, 0),
    name: p.name + [sugar && 'Đường ' + sugar, ice && 'Đá ' + ice, tops.length && tops.map(t => t.name).join(', ')].filter(Boolean).map((x, i, a) => i === 0 ? ' (' + x : x).join(' - ') + (sugar || tops.length ? ')' : '') });
  closeModal(); drawCart();
}
function drawCart() {
  $('cart').innerHTML = S.cart.map((it, i) => `<div class="bg-slate-50 border p-3 rounded-xl flex justify-between items-center text-xs">
    <div class="flex-1 pr-2"><div class="font-medium mb-1">${esc(it.name)}</div><div class="text-emerald-600 font-bold">${vnd(it.price * it.qty)}</div></div>
    <div class="flex items-center gap-2"><div class="bg-white border rounded-lg"><button onclick="qty(${i},-1)" class="px-2">-</button><b class="px-1">${it.qty}</b><button onclick="qty(${i},1)" class="px-2">+</button></div>
    <button onclick="S.cart.splice(${i},1);drawCart()" class="text-red-500"><i class="fa-solid fa-xmark"></i></button></div></div>`).join('') || '<p class="text-center text-slate-400 text-xs py-12">Chưa có món</p>';
  $('total').innerText = vnd(S.cart.reduce((s, i) => s + i.price * i.qty, 0));
}
function qty(i, d) { S.cart[i].qty += d; if (S.cart[i].qty <= 0) S.cart.splice(i, 1); drawCart(); }
function pay(method) {
  if (!S.cart.length) return alert('Đơn hàng trống!');
  const total = S.cart.reduce((s, i) => s + i.price * i.qty, 0);
  modal(`<div class="text-center"><h3 class="font-bold mb-1">${method === 'cash' ? 'Thanh toán tiền mặt' : 'Quét mã QR chuyển khoản'}</h3>
    <p class="text-xs text-slate-500 mb-4">Tổng tiền: <b class="text-emerald-600 text-base">${vnd(total)}</b></p>
    ${method === 'transfer' ? (S.menu.qr ? `<div class="bg-slate-50 p-3 rounded-xl inline-block border mb-4"><img src="${esc(S.menu.qr)}" class="w-56 h-56 object-contain"></div>` : '<p class="text-xs text-red-500 mb-4">Quản lý chưa upload mã QR.</p>') : ''}
    <div class="flex gap-3"><button onclick="closeModal()" class="btn-g flex-1">Hủy</button><button id="okbtn" onclick="submitOrder('${method}')" class="btn-p flex-1">${method === 'cash' ? 'Đã nhận tiền' : 'Thanh toán thành công'}</button></div></div>`);
}
const submitOrder = act(async method => {
  $('okbtn').disabled = true;
  try {
    const d = await api('/api/orders', { method: 'POST', body: { method, items: S.cart.map(({ productId, qty, sugar, ice, toppingIds }) => ({ productId, qty, sugar, ice, toppingIds })) } });
    S.cart = []; closeModal(); drawCart(); alert(`Thanh toán thành công! Mã đơn: ${d.code}`);
  } catch (e) { $('okbtn').disabled = false; throw e; }
});

/* ================= ADMIN: NHÂN VIÊN & CA ================= */
async function renderStaff() {
  S.users = await api('/api/users');
  const admin = S.user.role === 'admin';
  $('main').innerHTML = `<div class="flex-1 flex gap-6 p-6 overflow-hidden">
    <div class="card w-1/2 p-5 flex flex-col">
      <div class="flex justify-between mb-4"><h2 class="font-bold">Tài khoản</h2><button onclick="staffForm(0)" class="btn-p"><i class="fa-solid fa-user-plus"></i> Thêm</button></div>
      <div class="flex-1 overflow-y-auto space-y-3">${S.users.map(u => {
        const canEdit = admin ? true : u.role === 'staff', locked = u.role === 'admin' && u.id !== S.user.id;
        return `<div onclick="showShifts(${u.id})" class="bg-slate-50 border p-4 rounded-xl flex justify-between items-center cursor-pointer hover:border-emerald-600">
        <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">${esc(u.name.charAt(0))}</div>
        <div><div class="font-semibold text-sm">${esc(u.name)} <span class="text-[10px] px-2 py-0.5 rounded-full ${u.role === 'staff' ? 'bg-slate-200' : 'bg-amber-100 text-amber-700'}">${roleName(u.role)}</span></div><div class="text-xs text-slate-500">@${esc(u.username)}</div></div></div>
        <div>${canEdit && !locked ? `<button onclick="event.stopPropagation();staffForm(${u.id})" class="p-2 text-slate-500"><i class="fa-solid fa-pen"></i></button>` : ''}${canEdit && u.role !== 'admin' ? `<button onclick="event.stopPropagation();delUser(${u.id})" class="p-2 text-red-500"><i class="fa-solid fa-trash"></i></button>` : ''}</div></div>`; }).join('')}</div>
    </div>
    <div id="shifts" class="card w-1/2 p-5 flex flex-col"><p class="m-auto text-xs text-slate-400">Chọn một tài khoản để xem ca làm.</p></div></div>`;
}
function staffForm(id) {
  const u = id ? S.users.find(x => x.id === id) : { name: '', role: 'staff' };
  modal(`<h3 class="font-bold mb-4">${id ? 'Sửa tài khoản' : 'Thêm tài khoản'}</h3>
  <form onsubmit="saveStaff(event,${id})" class="space-y-3">
    <input class="inp" name="name" value="${esc(u.name)}" placeholder="Họ tên" required>
    ${id ? `<p class="text-xs text-slate-500">Tên đăng nhập: <b>${esc(u.username)}</b></p>` : '<input class="inp" name="username" placeholder="Tên đăng nhập" required>'}
    <input class="inp" name="password" placeholder="${id ? 'Mật khẩu mới (để trống nếu không đổi)' : 'Mật khẩu'}" ${id ? '' : 'required'}>
    ${S.user.role === 'admin' && u.role !== 'admin' ? `<select name="role" class="inp"><option value="staff" ${u.role === 'staff' ? 'selected' : ''}>Nhân viên</option><option value="manager" ${u.role === 'manager' ? 'selected' : ''}>Quản lý (có quyền admin)</option></select>` : ''}
    <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="btn-g flex-1">Hủy</button><button class="btn-p flex-1">Lưu</button></div></form>`);
}
const saveStaff = act(async (e, id) => {
  const b = Object.fromEntries(form(e)); if (!b.password) delete b.password;
  await api(id ? '/api/users/' + id : '/api/users', { method: id ? 'PUT' : 'POST', body: b });
  closeModal(); renderStaff();
});
const delUser = act(async id => { if (confirm('Xóa tài khoản này?')) { await api('/api/users/' + id, { method: 'DELETE' }); renderStaff(); } });
const showShifts = act(async uid => {
  const u = S.users.find(x => x.id === uid), list = await api('/api/shifts?user_id=' + uid);
  $('shifts').innerHTML = `<h2 class="font-bold text-sm mb-3">Ca làm: <span class="text-emerald-600">${esc(u.name)}</span></h2>
  <div class="space-y-2 overflow-y-auto max-h-60 mb-4">${list.map(s => `<div onclick="shiftOrders(${s.id})" class="bg-slate-50 border p-3 rounded-xl cursor-pointer hover:border-emerald-600 text-xs">
    <div class="flex justify-between"><b>${s.time_in.slice(0, 10)}</b><span>Vào ${s.time_in.slice(11, 16)} – ${s.time_out ? 'Ra ' + s.time_out.slice(11, 16) : '<b class="text-amber-600">đang làm</b>'}</span></div>
    <div class="flex justify-between mt-1"><span>Tiền mặt (kết ca): <b class="text-emerald-600">${vnd(s.cash)}</b></span><span>CK: <b class="text-blue-600">${vnd(s.transfer)}</b></span></div>
    ${s.time_out ? '' : `<button onclick="event.stopPropagation();closeShift(${s.id},${uid})" class="btn-r !py-1 mt-2">Chốt ca</button>`}</div>`).join('') || '<p class="text-xs text-slate-400">Chưa có ca làm.</p>'}</div>
  <div id="so" class="flex-1 overflow-y-auto bg-slate-50 border rounded-xl p-3 text-xs text-slate-500">Chọn một ca để xem đơn hàng...</div>`;
});
const closeShift = act(async (id, uid) => { if (confirm('Chốt ca này ngay bây giờ?')) { await api(`/api/shifts/${id}/close`, { method: 'POST' }); showShifts(uid); } });
const shiftOrders = act(async id => {
  const os = await api(`/api/shifts/${id}/orders`);
  $('so').innerHTML = os.map(o => `<div class="bg-white p-2 rounded-lg border mb-1.5 flex justify-between"><div><b class="text-slate-800">${esc(o.code)}</b> <span>${o.created_at.slice(11, 16)}</span><div>${o.items.map(i => esc(i.name) + ' x' + i.qty).join(', ')}</div></div><div class="text-right"><b class="text-emerald-600">${vnd(o.total)}</b><div class="text-[10px]">${o.method === 'cash' ? 'Tiền mặt' : 'CK'}</div></div></div>`).join('') || 'Ca này chưa có đơn.';
});

/* ================= ADMIN: MENU ================= */
let mtab = 'Nước';
function renderMenuAdmin(t) {
  mtab = t; const top = t === 'Topping', items = top ? S.menu.toppings : S.menu.products.filter(p => p.type === t);
  $('main').innerHTML = `<div class="flex-1 flex flex-col p-6 overflow-hidden">
    <div class="flex justify-between mb-6"><div class="flex gap-2">${['Nước', 'Bánh ngọt', 'Topping'].map(x => `<button onclick="renderMenuAdmin('${x}')" class="btn ${x === t ? 'bg-emerald-600 text-white' : 'bg-white border text-slate-600'}">${x}</button>`).join('')}</div>
    <button onclick="itemForm(0)" class="btn-p"><i class="fa-solid fa-plus"></i> Thêm mới</button></div>
    <div class="flex-1 overflow-y-auto grid grid-cols-4 gap-4 items-start">${items.map(i => `<div class="card p-4 flex flex-col">
      ${top ? '' : `<div class="h-24 rounded-xl overflow-hidden bg-slate-100 mb-2">${img(i.image)}</div>`}
      <h3 class="font-semibold text-xs line-clamp-1">${esc(i.name)}</h3><p class="text-emerald-600 font-bold text-xs mb-3">${vnd(i.price)}</p>
      <div class="flex gap-2 mt-auto"><button onclick="itemForm(${i.id})" class="btn-g flex-1 !py-2">Sửa</button><button onclick="delItem(${i.id})" class="btn-r flex-1 !py-2">Xóa</button></div></div>`).join('')}</div></div>`;
}
function itemForm(id) {
  const top = mtab === 'Topping', it = id ? (top ? S.menu.toppings : S.menu.products).find(x => x.id === id) : { name: '', price: '' };
  modal(`<h3 class="font-bold mb-4">${id ? 'Chỉnh sửa' : 'Thêm'} ${mtab}</h3><form onsubmit="saveItem(event,${id})" class="space-y-3">
    <input class="inp" name="name" value="${esc(it.name)}" placeholder="Tên" required>
    <input class="inp" name="price" type="number" min="0" step="500" value="${it.price}" placeholder="Giá (VNĐ)" required>
    ${top ? '' : `<input type="hidden" name="type" value="${mtab}"><div><p class="text-xs text-slate-500 mb-1">Hình ảnh ${id ? '(chọn file mới nếu muốn đổi)' : ''}</p><input type="file" name="image" accept="image/*" class="w-full text-xs file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-emerald-600 file:text-white"></div>`}
    <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="btn-g flex-1">Hủy</button><button class="btn-p flex-1">Lưu</button></div></form>`);
}
const refreshMenu = async () => { S.menu = await api('/api/menu'); renderMenuAdmin(mtab); };
const saveItem = act(async (e, id) => {
  const f = form(e), top = mtab === 'Topping', base = top ? '/api/toppings' : '/api/products';
  if (top) { const b = Object.fromEntries(f); await api(id ? `${base}/${id}` : base, { method: id ? 'PUT' : 'POST', body: b }); }
  else { if (!f.get('image').size) f.delete('image'); await api(id ? `${base}/${id}` : base, { method: id ? 'PUT' : 'POST', body: f }); }
  closeModal(); refreshMenu();
});
const delItem = act(async id => { if (confirm('Xóa mục này?')) { await api((mtab === 'Topping' ? '/api/toppings/' : '/api/products/') + id, { method: 'DELETE' }); refreshMenu(); } });

/* ================= ADMIN: QR ================= */
function renderQR() {
  $('main').innerHTML = `<div class="flex-1 flex items-center justify-center p-6"><div class="card p-8 w-full max-w-md text-center">
    <h2 class="font-bold text-lg mb-4">QR chuyển khoản</h2>
    <div class="bg-slate-50 p-4 rounded-xl inline-block mb-6 border">${S.menu.qr ? `<img id="qrp" src="${esc(S.menu.qr)}" class="w-52 h-52 object-contain">` : '<p class="text-xs text-slate-400 p-10">Chưa có QR</p>'}</div>
    <form onsubmit="saveQR(event)" class="space-y-4"><input type="file" name="image" accept="image/*" required class="w-full text-xs file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-emerald-600 file:text-white"><button class="btn-p w-full !py-3">Lưu QR mới</button></form></div></div>`;
}
const saveQR = act(async e => { await api('/api/qr', { method: 'POST', body: form(e) }); S.menu = await api('/api/menu'); renderQR(); alert('Đã cập nhật QR!'); });

/* ================= ADMIN: DOANH THU ================= */
function renderRev() {
  $('main').innerHTML = `<div class="flex-1 flex flex-col p-6 overflow-hidden">
    <div class="flex justify-between mb-6"><h2 class="font-bold text-lg">Doanh thu</h2><div class="flex gap-3">
      <select id="rt" onchange="revType()" class="inp !w-auto !py-2 text-xs"><option value="day">Theo ngày</option><option value="month">Theo tháng</option></select>
      <input id="rv" type="date" onchange="calcRev()" class="inp !w-auto !py-2 text-xs"></div></div>
    <div class="grid grid-cols-4 gap-4 mb-6">${[['Tổng', 'r-total', 'text-emerald-600'], ['Tiền mặt', 'r-cash', ''], ['Chuyển khoản', 'r-tf', 'text-blue-600'], ['Số đơn', 'r-count', '']].map(c => `<div class="card p-5"><p class="text-xs text-slate-400">${c[0]}</p><h3 id="${c[1]}" class="text-xl font-bold ${c[2]}">0</h3></div>`).join('')}</div>
    <div class="card flex-1 p-5 overflow-y-auto"><div id="rl" class="space-y-2"></div></div></div>`;
  $('rv').value = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Ho_Chi_Minh' }); calcRev();
}
function revType() { const m = $('rt').value === 'month', v = $('rv'), d = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Ho_Chi_Minh' }); v.type = m ? 'month' : 'date'; v.value = m ? d.slice(0, 7) : d; calcRev(); }
const calcRev = act(async () => {
  const d = await api(`/api/revenue?type=${$('rt').value}&value=${$('rv').value}`);
  $('r-total').innerText = vnd(d.total); $('r-cash').innerText = vnd(d.cash); $('r-tf').innerText = vnd(d.transfer); $('r-count').innerText = d.count;
  $('rl').innerHTML = d.orders.map(o => `<div class="bg-slate-50 border p-3 rounded-xl flex justify-between text-xs"><div><b>${esc(o.code)}</b> <span class="text-slate-400">${o.created_at} · ${esc(o.staff)}</span><div class="text-slate-500 mt-0.5">${o.items.map(i => esc(i.name) + ' x' + i.qty).join(', ')}</div></div><div class="text-right"><b class="text-emerald-600">${vnd(o.total)}</b><div class="text-[10px] text-slate-400">${o.method === 'cash' ? 'Tiền mặt' : 'Chuyển khoản'}</div></div></div>`).join('') || '<p class="text-xs italic text-slate-400 text-center py-6">Không có giao dịch.</p>';
});

if (S.token && S.user) start().catch(clearSession);
</script>
</body>
</html>
